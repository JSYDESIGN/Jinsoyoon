<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Felix's Korea Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;800&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column. Heading and a tap-the-map hint on top, a big tappable map below. Tapping the map opens a popup screen for the nearest city with the "With me?" Yes/No. */
:root {
  --bg: #F5F1FB;
  --fg: #261A3F;
  --muted: #6B5F85;
  --accent: #E6336B;
  --accent-fg: #FFFFFF;
  --sea: #DCEBFA;
  --land: #FFFFFF;
  --line: #261A3F;
  --card: #FFFFFF;
  --soft: #FFDDE8;
  --north: #E9E2F2;
  --font-display: "Bagel Fat One", "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body: "Albert Sans", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160F28; --fg: #F6EEFF; --muted: #B2A5CC; --accent: #FF6E9A; --accent-fg: #2A0A18;
    --sea: #1F2A52; --land: #2D2250; --line: #F6EEFF; --card: #221A3D; --soft: #4A2240; --north: #2A2150;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160F28; --fg: #F6EEFF; --muted: #B2A5CC; --accent: #FF6E9A; --accent-fg: #2A0A18;
  --sea: #1F2A52; --land: #2D2250; --line: #F6EEFF; --card: #221A3D; --soft: #4A2240; --north: #2A2150;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 36px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; align-items: center; text-align: center; }
h1 { font-family: var(--font-display); font-weight: 400; line-height: 1.08; text-wrap: balance; margin: 0; font-size: clamp(2.2rem, 8vw, 3.4rem); }
.sub { color: var(--muted); font-size: 1.08rem; margin: 10px auto 0; max-width: 40ch; }
.hint {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--accent-fg);
  font-weight: 800; font-size: 1rem; letter-spacing: .02em;
  padding: 10px 20px; border-radius: 999px; border: 2px solid var(--line);
  box-shadow: 4px 4px 0 var(--line);
  animation: nudge 1.8s ease-in-out infinite;
}
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.map-box { width: 100%; min-width: 0; }
svg.map { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; touch-action: manipulation; cursor: pointer; }
.sea { fill: var(--sea); }
.land { fill: var(--land); stroke: var(--line); stroke-width: 2.5; stroke-linejoin: round; }
.dmz { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 3 7; stroke-linecap: round; fill: none; }
.pin .dot { fill: var(--accent); stroke: var(--land); stroke-width: 3; }
.pin .ring { fill: none; stroke: var(--accent); stroke-width: 2.5; animation: ping 2s ease-out infinite; }
@keyframes ping { from { r: 9; opacity: .9; } to { r: 22; opacity: 0; } }
.pin text { font-family: var(--font-body); font-weight: 800; font-size: 13px; fill: var(--fg); paint-order: stroke; stroke: var(--land); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.pin:focus { outline: none; }
.pin:focus-visible .dot { stroke: var(--fg); stroke-width: 4; }
.floaty { font-size: 22px; pointer-events: none; animation: rise .9s ease-out forwards; }
@keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }

.overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(22, 12, 44, .6);
  display: flex; align-items: center; justify-content: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  position: relative; width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto;
  background: var(--card); color: var(--fg);
  border: 2px solid var(--line); border-radius: 28px;
  box-shadow: 8px 8px 0 var(--accent);
  padding: 30px 26px 26px;
  display: flex; flex-direction: column; gap: 16px; align-items: flex-start; text-align: left;
  animation: pop .3s ease;
}
@keyframes pop { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.close {
  position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
  font: inherit; font-size: 1.1rem; font-weight: 800; line-height: 1; cursor: pointer;
  background: transparent; color: var(--fg); border: 2px solid var(--line);
}
.tag {
  background: var(--soft); color: var(--fg);
  font-weight: 800; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 12px; border-radius: 999px;
}
.msg { font-family: var(--font-display); font-size: clamp(1.4rem, 5vw, 1.8rem); line-height: 1.25; margin: 0; text-wrap: balance; }
.ask { font-size: 1.15rem; font-weight: 600; margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; min-height: 68px; }
.btn {
  font-family: var(--font-display); font-size: 1.15rem; cursor: pointer;
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 28px;
  transition: transform .2s ease;
}
.btn.yes { background: var(--accent); color: var(--accent-fg); box-shadow: 4px 4px 0 var(--line); }
.btn.no { background: var(--card); color: var(--fg); }
.btn.no { touch-action: none; }
.btn.no.flee { position: fixed; z-index: 50; margin: 0; transition: left .25s cubic-bezier(.3,1.5,.5,1), top .25s cubic-bezier(.3,1.5,.5,1), transform .2s ease; }
.confetti span.trail { position: fixed; font-size: 26px; color: inherit; animation: trail .8s ease-out forwards; }
@keyframes trail { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-44px) scale(1.5); opacity: 0; } }
.btn:focus-visible, .close:focus-visible, .again:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.reply { min-height: 2.6em; margin: 0; color: var(--muted); font-weight: 600; }
.win { display: flex; flex-direction: column; gap: 12px; }
.win h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.1rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.win p { margin: 0; font-size: 1.1rem; }
.again { align-self: flex-start; font: inherit; font-weight: 800; cursor: pointer; background: var(--accent); color: var(--accent-fg); border: 2px solid var(--line); border-radius: 999px; padding: 8px 20px; margin-top: 4px; }
.sheet.done .msg, .sheet.done .ask, .sheet.done .btns, .sheet.done .reply { display: none; }
.north-land { fill: var(--north); stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 6; stroke-linejoin: round; }
.nk { font-family: var(--font-body); font-weight: 800; font-size: 11px; letter-spacing: .28em; fill: var(--muted); pointer-events: none; }
.pin.north .dot { fill: var(--fg); }
.pin.north .ring { stroke: var(--fg); }
.sheet.solo .ask, .sheet.solo .btns, .sheet.solo .reply { display: none; }
.solo { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.solo .line { font-family: var(--font-display); font-size: clamp(1.3rem, 4.6vw, 1.6rem); line-height: 1.25; margin: 0; opacity: 0; transform: translateY(8px); transition: opacity .35s ease, transform .35s ease; }
.solo .line.show, .solo .again.show { opacity: 1; transform: none; }
.solo .again { opacity: 0; pointer-events: none; transition: opacity .35s ease; }
.solo .again.show { pointer-events: auto; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.confetti span { position: absolute; top: -30px; color: var(--accent); animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .hint, .pin .ring, .floaty, .sheet { animation: none; }
  .pin .ring { opacity: .5; r: 15; }
  .btn, .btn.no.flee { transition: none; }
  .confetti span.trail { animation: none; display: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>Where do you wanna go, Felix? 🇰🇷</h1>
    <p class="sub">Tap anywhere on the map to plan your next adventure… ♡</p>
  </header>
  <div class="hint" aria-hidden="true">👆 Tap the map!</div>

  <div class="map-box">
    <svg class="map" id="map" viewBox="0 -70 400 670" role="group" aria-label="Map of South Korea with eleven places to tap">
      <rect class="sea" x="0" y="-70" width="400" height="670" rx="28"></rect>
      <path class="land" id="mainland" d=""></path>
      <ellipse class="land" cx="85" cy="550" rx="40" ry="15"></ellipse>
      <g id="pins"></g>
      <g id="floaties"></g>
    </svg>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="tag">
    <button class="close" id="close" type="button" aria-label="Close">✕</button>
    <span class="tag" id="tag">Seoul</span>
    <p class="msg" id="msg" aria-live="polite"></p>
    <p class="ask" id="ask">With me? 🥹❤️</p>
    <div class="btns" id="btns">
      <button class="btn yes" id="yes" type="button">YES</button>
      <button class="btn no" id="no" type="button">NO</button>
    </div>
    <p class="reply" id="reply" aria-live="polite"></p>
    <div class="solo" id="solo" hidden>
      <p class="line" id="s2"></p>
      <p class="line" id="s3"></p>
      <button class="again" id="back2" type="button">Back to the map</button>
    </div>
    <div class="win" id="win" hidden>
      <h2>CORRECT ANSWER, FELIX!! 🎉❤️</h2>
      <p>Your girlfriend has officially been added to all your future adventures.</p>
      <p>Good choice, Felix. I knew you were smart. 😌</p>
      <button class="again" id="again" type="button">Back to the map</button>
    </div>
  </div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Mainland outline (stylised), smoothed with a closed Catmull-Rom curve
  var pts = [[40,115],[130,62],[210,60],[267,30],[290,70],[320,115],[340,170],[370,240],[375,290],[370,340],[350,380],[320,392],[270,405],[200,420],[160,440],[120,450],[60,430],[80,390],[70,340],[100,300],[80,260],[50,200],[100,190],[90,150],[70,120]];
  function smooth(p) {
    var n = p.length, d = "M" + p[0][0] + " " + p[0][1];
    for (var i = 0; i < n; i++) {
      var p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0] + " " + p2[1];
    }
    return d + " Z";
  }
  document.getElementById("mainland").setAttribute("d", smooth(pts));

  // a = text-anchor, lx/ly = label offset from the pin
  var places = [
    { name: "Seoul",      x: 128, y: 133, lx: 0,   ly: -16, a: "middle", msg: "Seoul? With me, Felix. ♡" },
    { name: "Incheon",    x: 98,  y: 150, lx: -14, ly: 5,   a: "end",    msg: "Incheon? The airport is right there, and so am I, Felix. ✈️" },
    { name: "Gangneung",  x: 312, y: 118, lx: -14, ly: 5,   a: "end",    msg: "A seaside trip without your favorite person? Not happening, Felix." },
    { name: "Daejeon",    x: 168, y: 255, lx: 14,  ly: 5,   a: "start",  msg: "Daejeon? Bakery stops, and I get the first bite, Felix. 🥐" },
    { name: "Jeonju",     x: 145, y: 308, lx: 14,  ly: 5,   a: "start",  msg: "Jeonju bibimbap for one? Absolutely not. Two spoons, Felix. 🍚" },
    { name: "Daegu",      x: 290, y: 303, lx: 0,   ly: -16, a: "middle", msg: "Daegu is hot, but I’m hotter. You’re not going without me, Felix. 🔥" },
    { name: "Gyeongju",   x: 346, y: 306, lx: 0,   ly: 26,  a: "middle", msg: "Ancient temples, beautiful views, and me bothering you the entire time, Felix. ❤️" },
    { name: "Busan",      x: 330, y: 372, lx: -14, ly: 5,   a: "end",    msg: "The ocean is pretty, but I’m prettier. Take me with you, Felix. 🤭" },
    { name: "Yeosu",      x: 200, y: 408, lx: 0,   ly: 28,  a: "middle", msg: "Yeosu at night is romantic, Felix. Who’s holding your hand? Me. 🌃" },
    { name: "Jeju Island",x: 85,  y: 550, lx: 0,   ly: 36,  a: "middle", msg: "You thought you could go to an island without me, Felix? Cute." },
    { name: "Pyongyang",  x: 80,  y: -34, lx: 0,   ly: 26,  a: "middle", solo: true, msg: "Oh, you wanna go to NORTH KOREA, Felix? 🇰🇵", lines: ["Aww, that’s cute. 🥹", "You’re on your own for this one 💀"] }
  ];

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  var pinsG = document.getElementById("pins");
  places.forEach(function (p, i) {
    var g = el("g", { "class": p.solo ? "pin north" : "pin", tabindex: "0", role: "button", "aria-label": p.name }, pinsG);
    var ring = el("circle", { "class": "ring", cx: p.x, cy: p.y, r: 9 }, g);
    ring.style.animationDelay = (i * 0.2) + "s";
    el("circle", { "class": "dot", cx: p.x, cy: p.y, r: 8 }, g);
    var t = el("text", { x: p.x + p.lx, y: p.y + p.ly, "text-anchor": p.a }, g);
    t.textContent = p.name;
    g.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCity(p); }
    });
    g.addEventListener("click", function (e) { e.stopPropagation(); spawnHeart(p.x, p.y); openCity(p); });
  });

  var svg = document.getElementById("map");
  var floaties = document.getElementById("floaties");

  function spawnHeart(x, y) {
    var h = el("text", { "class": "floaty", x: x - 10, y: y + 6 }, floaties);
    h.textContent = "♡";
    h.setAttribute("fill", getComputedStyle(document.documentElement).getPropertyValue("--accent"));
    setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 950);
  }

  // Tap anywhere on the map: snap to the nearest city and open its screen
  svg.addEventListener("click", function (e) {
    var r = svg.getBoundingClientRect();
    var x = (e.clientX - r.left) * (400 / r.width);
    var y = (e.clientY - r.top) * (670 / r.height) - 70;
    var best = places[0], bd = Infinity;
    places.forEach(function (p) {
      var d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = p; }
    });
    spawnHeart(x, y);
    openCity(best);
  });

  // Popup screen
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  var tag = document.getElementById("tag");
  var msg = document.getElementById("msg");
  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var reply = document.getElementById("reply");
  var win = document.getElementById("win");
  var confetti = document.getElementById("confetti");
  var tries = 0;
  var lastFocus = null;
  var solo = document.getElementById("solo");
  var soloTimers = [];

  function clearSolo() {
    soloTimers.forEach(clearTimeout);
    soloTimers = [];
    var items = solo.querySelectorAll(".line, .again");
    for (var i = 0; i < items.length; i++) items[i].classList.remove("show");
  }

  // Pyongyang: no question, three lines appear one by one, then a skull rain
  function playSolo(p) {
    var l2 = document.getElementById("s2"), l3 = document.getElementById("s3"), b = document.getElementById("back2");
    l2.textContent = p.lines[0];
    l3.textContent = p.lines[1];
    [[l2, 1000], [l3, 2200], [b, 3200]].forEach(function (s, i) {
      soloTimers.push(setTimeout(function () {
        s[0].classList.add("show");
        if (i === 1) burst(["💀"]);
        if (i === 2) b.focus({ preventScroll: true });
      }, reduce ? 0 : s[1]));
    });
  }

  var noMsgs = [
    "Nice try, Felix 😂",
    "You really thought that would work, Felix?",
    "Error 404: Permission to leave your girlfriend behind not found.",
    "Wrong answer, Felix. Try again. 🤭",
    "Are you sure, Felix? 🥺"
  ];

  function applySize() {
    var grow = Math.min(1 + tries * 0.08, 1.35);
    var shrink = Math.max(1 - tries * 0.08, 0.6);
    yes.style.transform = "scale(" + grow + ")";
    yes.style.marginInline = (grow - 1) * 30 + "px";
    no.style.transform = "scale(" + shrink + ")";
  }

  function openCity(p) {
    tries = 0;
    resetNo();
    applySize();
    reply.textContent = "";
    win.hidden = true;
    sheet.classList.remove("done");
    clearSolo();
    tag.textContent = p.name;
    msg.textContent = p.msg;
    sheet.classList.toggle("solo", !!p.solo);
    solo.hidden = !p.solo;
    lastFocus = document.activeElement;
    overlay.hidden = false;
    if (p.solo) playSolo(p); else yes.focus({ preventScroll: true });
  }

  function closeSheet() {
    overlay.hidden = true;
    clearSolo();
    resetNo();
    confetti.innerHTML = "";
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }

  // The NO button runs away around the whole screen, leaving a silly face behind
  var spacer = null;
  var faces = ["😝", "😜"];
  var faceI = 0;

  function resetNo() {
    no.classList.remove("flee");
    no.style.left = "";
    no.style.top = "";
    no.textContent = "NO";
    if (spacer && spacer.parentNode) spacer.parentNode.removeChild(spacer);
    spacer = null;
  }

  function dodge() {
    var w = no.offsetWidth, h = no.offsetHeight;
    var r = no.getBoundingClientRect();
    var ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    if (!spacer) {
      spacer = document.createElement("span");
      spacer.style.display = "inline-block";
      spacer.style.width = w + "px";
      spacer.style.height = h + "px";
      no.parentNode.insertBefore(spacer, no);
      no.classList.add("flee");
      no.style.left = (ox - w / 2) + "px";
      no.style.top = (oy - h / 2) + "px";
      void no.offsetWidth;
    }
    var vw = window.innerWidth, vh = window.innerHeight;
    var yr = yes.getBoundingClientRect();
    var nx = 14, ny = 48;
    for (var i = 0; i < 40; i++) {
      var tx = 14 + Math.random() * Math.max(1, vw - w - 28);
      var ty = 48 + Math.random() * Math.max(1, vh - h - 72);
      var far = Math.hypot(tx + w / 2 - ox, ty + h / 2 - oy) > Math.min(vw, vh) * 0.3;
      var hitYes = tx < yr.right + 24 && tx + w > yr.left - 24 && ty < yr.bottom + 24 && ty + h > yr.top - 24;
      nx = tx; ny = ty;
      if (far && !hitYes) break;
    }
    var face = faces[faceI++ % faces.length];
    if (!reduce) {
      var t = document.createElement("span");
      t.className = "trail";
      t.textContent = face;
      t.style.left = (ox - 14) + "px";
      t.style.top = (oy - 16) + "px";
      confetti.appendChild(t);
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 900);
    }
    no.textContent = "NO " + face;
    no.style.left = nx + "px";
    no.style.top = ny + "px";
    reply.textContent = noMsgs[tries % noMsgs.length];
    tries++;
    applySize();
  }

  no.addEventListener("pointerenter", function (e) { if (e.pointerType === "mouse") dodge(); });
  no.addEventListener("pointerdown", function (e) { e.preventDefault(); dodge(); });
  no.addEventListener("click", dodge);

  function burst(custom) {
    if (reduce) return;
    var bits = custom || ["❤", "♡", "💖", "✨"];
    for (var i = 0; i < (custom ? 18 : 36); i++) {
      var s = document.createElement("span");
      s.textContent = bits[i % bits.length];
      s.style.left = Math.random() * 100 + "%";
      s.style.fontSize = 16 + Math.random() * 22 + "px";
      s.style.animationDuration = 2.2 + Math.random() * 2 + "s";
      s.style.animationDelay = Math.random() * 0.6 + "s";
      confetti.appendChild(s);
    }
    setTimeout(function () { confetti.innerHTML = ""; }, 5200);
  }

  yes.addEventListener("click", function () {
    sheet.classList.add("done");
    win.hidden = false;
    burst();
    document.getElementById("again").focus({ preventScroll: true });
  });

  document.getElementById("again").addEventListener("click", closeSheet);
  document.getElementById("back2").addEventListener("click", closeSheet);
  document.getElementById("close").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden) closeSheet(); });
})();
</script>

</body></html>
